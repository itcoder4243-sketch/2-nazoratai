{% extends "base_t.html" %}
{% block body %}
<main>
<div class="card" style="margin-bottom:18px">
<h2>Talabalar qo'shish</h2>
<form method="post" action="/t/students/add">
<label>Har bir qatorga bitta talaba. Faqat ism yozsangiz login va parol avtomatik yaratiladi. Xohlasangiz: Ism; login; parol</label>
<textarea name="text" required placeholder="Ali Valiyev&#10;Dilnoza Karimova&#10;Jasur Toshmatov; jasur; 12345"></textarea>
<p><button>Qo'shish</button></p>
</form></div>
<div class="card" style="margin-bottom:18px">
<div style="display:flex;justify-content:space-between"><h2>Ro'yxat ({{ st|length }})</h2><button class="sec" onclick="window.print()">Chop etish</button></div>
<table><tr><th>Guruh</th><th>Ism</th><th>Login</th><th>Parol</th><th class="noprint"></th></tr>
{% for s in st %}
<tr><td>{{ s.grp or "" }}</td><td>{{ s.name }}</td><td><code>{{ s.login }}</code></td><td><code>{{ s.pw_plain }}</code></td>
<td><form method="post" action="/t/students/delete/{{ s.id }}" onsubmit="return confirm('O\'chiraymi? Natijalari ham o\'chadi.')"><button class="bad">×</button></form></td></tr>
{% endfor %}</table></div>
</main>
<style>@media print{.side,form,.noprint{display:none}body{display:block!important}}</style>
{% endblock %}
